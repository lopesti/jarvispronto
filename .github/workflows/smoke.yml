name: Smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    name: Docker Smoke - C1 C2 C3 C5
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências dos testes
        run: npm ci

      - name: Gerar ambiente isolado de CI
        shell: bash
        run: |
          cat > .env <<'EOF'
          NODE_ENV=production
          PORT=3000
          TRUST_PROXY=1
          DATABASE_URL=postgres://jarvis:test_password_strong@postgres:5432/jarvispronto
          POSTGRES_USER=jarvis
          POSTGRES_PASSWORD=test_password_strong
          POSTGRES_DB=jarvispronto
          REDIS_URL=redis://redis:6379
          JWT_SECRET=fake_jwt_secret_at_least_32_chars_long_x
          INTERNAL_SIM_TOKEN=fake_internal_token_at_least_32_chars_ok
          METRICS_TOKEN=fake_metrics_token_at_least_32_chars_ok
          ALLOW_DEFAULT_BOT_CONFIG=1
          GEMINI_API_KEY=
          GROQ_API_KEY=
          USE_MESSAGE_QUEUE=1
          CORS_ORIGINS=http://localhost,https://localhost
          EOF

          # Arquivo temporário exclusivo do runner.
          # Nunca contém o prompt ou os dados reais do bot.
          printf '%s\n' '{"systemPrompt":"CI smoke test","fallbackMessage":"CI fallback"}' > bot_volumetrao.json

      - name: Gerar certificado HTTPS temporário
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout nginx/certs/privkey.pem \
            -out nginx/certs/fullchain.pem \
            -subj "/CN=localhost"

      - name: Subir stack Docker
        run: docker compose --profile full up -d --build --wait

      - name: Aguardar API
        shell: bash
        run: |
          for i in {1..30}; do
            if docker compose exec -T api curl -fsS \
              http://localhost:3000/health >/dev/null 2>&1; then
              echo "API pronta."
              exit 0
            fi
            echo "Aguardando API: $i/30"
            sleep 2
          done

          docker compose logs api --tail 100
          echo "API não respondeu no prazo."
          exit 1

      - name: Aguardar Nginx HTTPS
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -kfsS https://localhost/nginx-health >/dev/null 2>&1; then
              echo "Nginx HTTPS pronto."
              exit 0
            fi
            echo "Aguardando Nginx: $i/30"
            sleep 2
          done

          docker compose logs nginx --tail 100
          echo "Nginx não respondeu no prazo."
          exit 1

      - name: Verificar serviços e executar C1 C2 C3 C5
        run: npm run test:smoke
        env:
          JARVIS_BASE_URL: https://localhost
          JARVIS_BASE_URL_HTTP: http://localhost
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
          METRICS_TOKEN: fake_metrics_token_at_least_32_chars_ok
          INTERNAL_SIM_TOKEN: fake_internal_token_at_least_32_chars_ok

      - name: Coletar logs
        if: always()
        run: |
          mkdir -p ci-logs
          docker compose ps > ci-logs/compose-ps.txt 2>&1 || true
          docker compose logs --no-color api > ci-logs/api.log 2>&1 || true
          docker compose logs --no-color worker > ci-logs/worker.log 2>&1 || true
          docker compose logs --no-color nginx > ci-logs/nginx.log 2>&1 || true
          docker compose logs --no-color postgres > ci-logs/postgres.log 2>&1 || true
          docker compose logs --no-color redis > ci-logs/redis.log 2>&1 || true
          docker compose logs --no-color frontend > ci-logs/frontend.log 2>&1 || true

      - name: Salvar logs se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ github.run_id }}
          path: ci-logs/
          retention-days: 7

      - name: Encerrar containers do CI
        if: always()
        run: docker compose --profile full down