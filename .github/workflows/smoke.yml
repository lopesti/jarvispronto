name: Smoke

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (C1-C3)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar .env de CI
        run: |
          cat > .env <<EOF
          NODE_ENV=production
          PORT=3000
          TRUST_PROXY=1
          DATABASE_URL=postgres://jarvis:test_password_strong@postgres:5432/jarvispronto
          POSTGRES_USER=jarvis
          POSTGRES_PASSWORD=test_password_strong
          POSTGRES_DB=jarvispronto
          REDIS_URL=redis://redis:6379
          JWT_SECRET=fake_jwt_secret_at_least_32_chars_long_x
          INTERNAL_SIM_TOKEN=fake_internal_token_at_least_32_chars_ok
          GEMINI_API_KEY=
          GROQ_API_KEY=
          USE_MESSAGE_QUEUE=0
          CORS_ORIGINS=http://localhost,https://localhost
          EOF

      - name: Gerar cert self-signed pro nginx
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout nginx/certs/privkey.pem \
            -out nginx/certs/fullchain.pem \
            -subj "/CN=localhost"

      - name: Subir stack Docker
        run: docker compose --profile full up -d

      - name: Aguardar API responder
        run: |
          for i in {1..30}; do
            if docker compose exec -T api curl -sf http://localhost:3000/health > /dev/null; then
              echo "API OK"
              exit 0
            fi
            sleep 2
          done
          echo "API nao respondeu em 60s"
          exit 1

      - name: Aguardar nginx responder
        run: |
          for i in {1..30}; do
            if curl -skf https://localhost/nginx-health > /dev/null; then
              echo "Nginx OK"
              exit 0
            fi
            sleep 2
          done
          echo "Nginx nao respondeu em 60s"
          exit 1

      - name: Rodar smoke tests
        run: npm run test:smoke
        env:
          JARVIS_BASE_URL: https://localhost
          JARVIS_BASE_URL_HTTP: http://localhost
          INTERNAL_SIM_TOKEN: fake_internal_token_at_least_32_chars_ok
          METRICS_TOKEN: fake_internal_token_at_least_32_chars_ok

      - name: Dump de logs (sempre)
        if: always()
        run: docker compose logs --tail=100

      - name: Upload logs (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-compose.log

      - name: Derrubar stack
        if: always()
        run: docker compose --profile full down