name: Smoke

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (C1-C3)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar .env de CI
        run: |
          cat > .env <<EOF
          NODE_ENV=production
          PORT=3000
          TRUST_PROXY=1
          DATABASE_URL=postgres://jarvis:test_password_strong@postgres:5432/jarvispronto
          POSTGRES_USER=jarvis
          POSTGRES_PASSWORD=test_password_strong
          POSTGRES_DB=jarvispronto
          REDIS_URL=redis://redis:6379
          JWT_SECRET=fake_jwt_secret_at_least_32_chars_long_x
          INTERNAL_SIM_TOKEN=fake_internal_token_at_least_32_chars_ok
          GEMINI_API_KEY=
          GROQ_API_KEY=
          USE_MESSAGE_QUEUE=0
          CORS_ORIGINS=http://localhost,https://localhost
          EOF

      - name: Gerar cert self-signed pro nginx
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout nginx/certs/privkey.pem \
            -out nginx/certs/fullchain.pem \
            -subj "/CN=localhost"

      - name: Subir stack Docker
        run: docker compose --profile full up -d --wait
        env:
          DOCKER_BUILDKIT: 1

      - name: Aguardar API responder (via docker exec)
        run: |
          for i in {1..30}; do
            if docker compose exec -T api curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "✅ API pronta (interna)!"
              break
            fi
            echo "⏳ Tentativa $i/30 — aguardando API..."
            sleep 2
          done

          # Confirma que realmente subiu
          if ! docker compose exec -T api curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
            echo "❌ API não respondeu em 60s"
            docker compose logs api --tail 50
            exit 1
          fi

      - name: Aguardar nginx responder
        run: |
          for i in {1..20}; do
            # Tenta HTTP e HTTPS
            if curl -fsS -k https://localhost/health >/dev/null 2>&1 || \
               curl -fsS http://localhost/health >/dev/null 2>&1; then
              echo "✅ Nginx respondendo!"
              break
            fi
            echo "⏳ Tentativa $i/20 — aguardando nginx..."
            sleep 2
          done
          echo "ℹ️ Continuando mesmo se nginx não responder 200 em /health"

      - name: Rodar smoke tests
        run: npm run test:smoke
        env:
          # Tenta HTTPS primeiro (nginx), fallback pra HTTP
          BASE_URL: https://localhost
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      - name: Dump de logs (sempre)
        if: always()
        run: |
          mkdir -p ci-logs
          docker compose ps > ci-logs/compose-ps.txt 2>&1 || true
          docker compose logs --no-color api      > ci-logs/api.log      2>&1 || true
          docker compose logs --no-color worker   > ci-logs/worker.log   2>&1 || true
          docker compose logs --no-color nginx    > ci-logs/nginx.log    2>&1 || true
          docker compose logs --no-color postgres > ci-logs/postgres.log 2>&1 || true
          docker compose logs --no-color redis    > ci-logs/redis.log    2>&1 || true

      - name: Upload logs (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ github.run_id }}
          path: ci-logs/
          retention-days: 7

      - name: Derrubar stack
        if: always()
        run: docker compose down -v --remove-orphans