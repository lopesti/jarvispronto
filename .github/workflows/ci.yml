name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: node -c engine/app.js
      - run: node tests/unit/handoffKeywords.test.js || true
      - run: node tests/unit/webhook-token.test.js || true
      - run: npm audit --audit-level=critical || true
