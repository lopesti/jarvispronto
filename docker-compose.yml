services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://jarvis:jarvis_secret@postgres:5432/jarvispronto
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: jarvis
      PGPASSWORD: jarvis_secret
      PGDATABASE: jarvispronto
    volumes:
      - jarvis_auth:/app/auth_info_jarvis
      - jarvis_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jarvis-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://api:3000
    container_name: jarvis-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://api:3000
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NODE_ENV: development
      WATCHPACK_POLLING: true
    command: ["npm", "run", "dev", "--", "-p", "3001"]
    depends_on:
      - api
    networks:
      - jarvis-net

  postgres:
    image: postgres:16-alpine
    container_name: jarvis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis_secret
      POSTGRES_DB: jarvispronto
    ports:
      - "5432:5432"
    volumes:
      - jarvis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvispronto"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jarvis-net

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - jarvis_redis:/data
    networks:
      - jarvis-net
    profiles:
      - full

volumes:
  jarvis_auth:
  jarvis_logs:
  jarvis_pgdata:
  jarvis_redis:

networks:
  jarvis-net:
    driver: bridge