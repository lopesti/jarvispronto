# .gitleaks.toml
# Configuração do Gitleaks pro projeto jarvispronto

[extend]
useDefault = true

# ─── Allowlists globais ────────────────────────────────
[[allowlists]]
description = "Falsos positivos conhecidos do projeto"

# Caminhos onde secrets fake são OK (workflows de CI, testes, exemplos)
paths = [
    '''\.github/workflows/ci\.yml''',
    '''\.github/workflows/smoke\.yml''',
    '''\.github/workflows/build-and-push\.yml''',
    '''\.env\.example''',
    '''tests/.*''',
    '''__tests__/.*''',
    '''.*\.test\.(js|ts|jsx|tsx)$''',
    '''.*\.spec\.(js|ts|jsx|tsx)$''',
]

# Valores claramente de teste (aplicado ao VALOR do secret)
regexes = [
    '''(?i)test[_-]?secret.*''',
    '''(?i)test[_-]?password.*''',
    '''(?i)ci[_-].*[_-]test.*''',
    '''(?i)fake[_-].*''',
    '''(?i)dummy[_-].*''',
    '''(?i)example[_-].*''',
    '''test_secret_min_16_chars_ok''',
    '''ci_jwt_secret_at_least_32_chars_long_x''',
    '''ci_internal_token_at_least_32_chars_ok''',
    '''ci_test_password_strong''',
]

# Commits específicos onde sabemos que é falso positivo (opcional)
